{# icons.html - inline SVG icons (no external icon font, CSP-friendly) #}
{%- macro icon(name) -%}
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">
{%- if name == 'overview' -%}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'domain' -%}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>
{%- elif name == 'username' -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c1.2-4 4.3-6 8-6s6.8 2 8 6"/>
{%- elif name == 'email' -%}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
{%- elif name == 'reputation' -%}<path d="M12 3 4 6v6c0 4.6 3.3 8.1 8 9 4.7-.9 8-4.4 8-9V6z"/><path d="m9 12 2 2 4-4"/>
{%- elif name == 'graph' -%}<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.3 7l7.3.0M7.3 8.2l3.6 7.6M16.8 9.2l-3.6 6.7"/>
{%- elif name == 'history' -%}<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>
{%- elif name == 'about' -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>
{%- elif name == 'search' -%}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
{%- elif name == 'theme' -%}<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif name == 'menu' -%}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'close' -%}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'chevron' -%}<path d="m6 9 6 6 6-6"/>
{%- elif name == 'arrow' -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- endif -%}
</svg>
{%- endmacro -%}
